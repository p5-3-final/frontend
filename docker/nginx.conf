# 정적 SPA 서빙. API는 브라우저가 api-gateway로 직접 호출하므로 여기서 프록시하지 않는다.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # 파일 이름에 해시가 붙은 빌드 산출물은 내용이 바뀌면 이름도 바뀌므로 오래 캐시한다.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # 클라이언트 라우트(/login, /analysis 등)는 index.html로 돌려준다.
    # index.html은 새 배포의 자산 경로를 바로 받도록 캐시하지 않는다.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
